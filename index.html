const stick=document.querySelector('#stick'),nub=document.querySelector('#nub'),jumpBtn=document.querySelector('#jump');let pointer=null,center={x:0,y:0};stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);const r=stick.getBoundingClientRect();center={x:r.left+r.width/2,y:r.top+r.height/2};moveStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});function moveStick(e){let dx=e.clientX-center.x,dy=e.clientY-center.y,l=Math.hypot(dx,dy),max=40;if(l>max){dx*=max/l;dy*=max/l}nub.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;input.x=dx/max;input.z=dy/max}function endStick(e){if(pointer===e.pointerId){pointer=null;input.x=0;input.z=0;nub.style.transform='translate(-50%,-50%)'}}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function finish(){playing=false;won=true;ui.emblem.textContent='🏰';ui.sub.textContent='¡NIVEL SUPERADO!';ui.title.textContent='¡Lo lograste!';ui.message.textContent=`Recolectaste las ${starsTaken} estrellas y llegaste al castillo. ¡Aventura perfecta!`;ui.button.textContent='JUGAR DE NUEVO';ui.overlay.classList.remove('hidden')}
function loseLife(){if(invincible>0)return;lives--;ui.lives.textContent=lives;if(lives<=0){playing=false;ui.emblem.textContent='💫';ui.sub.textContent='OOPS! TRY AGAIN';ui.title.textContent='Take another run';ui.message.textContent='The meadow is full of little surprises. Give it another go and reach the castle!';ui.button.textContent='TRY AGAIN';ui.overlay.classList.remove('hidden');return}hero.position.set(checkpoint.x,checkpoint.y,checkpoint.z);vy=0;invincible=2;showToast('BACK IN ACTION!')}
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.035);elapsed+=dt;if(playing){timer-=dt;if(timer<=0){timer=0;loseLife();timer=180}ui.time.textContent=Math.ceil(timer);if(invincible>0)invincible-=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show')}
let ix=input.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iz=input.z+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);let mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}const sprint=keys.ShiftLeft||keys.ShiftRight,speed=sprint?8.3:6.3;hero.position.x+=ix*speed*dt;hero.position.z+=iz*speed*dt;hero.position.x=THREE.MathUtils.clamp(hero.position.x,-5.7,5.7);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-47,13);if(Math.abs(ix)+Math.abs(iz)>.05)hero.rotation.y=Math.atan2(ix,-iz);
const prevY=hero.position.y;vy-=24*dt;hero.position.y+=vy*dt;onGround=false;let land=null;for(const p of platforms){if(hero.position.x>p.x-p.w/2+.05&&hero.position.x<p.x+p.w/2-.05&&hero.position.z>p.z-p.d/2+.05&&hero.position.z<p.z+p.d/2-.05&&vy<=0&&prevY>=p.y-.04&&hero.position.y<=p.y){if(!land||p.y>land.y)land=p}}if(land){hero.position.y=land.y;vy=0;onGround=true;if(hero.position.z<checkpoint.z-7)checkpoint={x:hero.position.x,z:hero.position.z,y:land.y}}
if(hero.position.y< -6){loseLife()}
for(const c of coins){if(c.got)continue;c.obj.rotation.y=elapsed*2.7;c.obj.position.y=c.baseY+Math.sin(elapsed*3+c.obj.position.x)*.11;if(hero.position.distanceTo(c.obj.position)<1.15){c.got=true;c.obj.visible=false;coinsTaken++;ui.coins.textContent=String(coinsTaken).padStart(2,'0');showToast(coinsTaken%5===0?'SUPER COIN STREAK!':'+1 COIN!')}}
for(const s of stars){if(s.got)continue;s.obj.rotation.y=Math.sin(elapsed*1.7)*.32;s.obj.rotation.z=Math.sin(elapsed*2.3)*.07;s.obj.position.y=s.baseY+Math.sin(elapsed*3+s.obj.position.z)*.14;const dx=hero.position.x-s.obj.position.x,dz=hero.position.z-s.obj.position.z;if(Math.hypot(dx,dz)<1.05&&Math.abs(hero.position.y+1-s.obj.position.y)<1.25){s.got=true;s.obj.visible=false;starsTaken++;ui.stars.textContent=`${starsTaken}/${requiredStars}`;showToast(starsTaken===requiredStars?'¡TODAS LAS ESTRELLAS!':'¡ESTRELLA!')}}
for(const e of enemies){if(e.dead)continue;e.phase+=dt*1.3;e.obj.position.x=e.x+Math.sin(e.phase)*.85;if(hero.position.distanceTo(e.obj.position)<.95){if(vy< -1&&hero.position.y>e.y+.3){e.dead=true;e.obj.visible=false;vy=7;showToast('NICE STOMP!')}else loseLife()}}
blocks.forEach((b,i)=>{b.position.y=.035*Math.sin(elapsed*3+i)});goalFlag.position.y=5.35+.14*Math.sin(elapsed*3);const atGoal=hero.position.z<-39&&hero.position.y>0.6&&Math.abs(hero.position.x)<7;if(starsTaken===requiredStars)goalFlag.material.color.setHex(0x54d878);if(atGoal){if(starsTaken===requiredStars)finish();else if(!goalBlocked){goalBlocked=true;showToast(`¡Encuentra las ${requiredStars-starsTaken} estrellas que faltan!`)}}else goalBlocked=false;}
// Springy follow cam and a comfortable behind-the-player perspective.
const targetCam=new THREE.Vector3(hero.position.x*.42,hero.position.y+7.6,hero.position.z+10.2);camera.position.lerp(targetCam,1-Math.pow(.001,dt));camera.lookAt(hero.position.x*.45,hero.position.y+1.05,hero.position.z-4.3);
const moving=playing&&(Math.abs(input.x)+Math.abs(input.z)+((keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight)?1:0)>.05);let step=moving&&onGround?Math.sin(elapsed*16)*.13:0;legs[0].rotation.x=step;legs[1].rotation.x=-step;shadow.position.y=.12-hero.position.y;hero.children.forEach(o=>{if(o.material&&o.material!==shadow.material)o.visible=!(invincible>0&&Math.floor(elapsed*16)%2===0)||o===shadow});renderer.render(scene,camera)}
frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight)});
</script>
