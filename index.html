<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#72d4ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E🍄%3C/text%3E%3C/svg%3E">
<title>Mushroom Meadow — Aventura</title>
<style>
:root{color-scheme:light;--ink:#203b56;--cream:#fff8df;--red:#ed5149;--gold:#ffcc38}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72d4ff;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none}.topbar{position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}.brand,.stats,.hint,.panel{border:3px solid rgba(255,255,255,.82);box-shadow:0 6px 0 rgba(32,75,111,.15),0 12px 30px rgba(27,71,107,.13);backdrop-filter:blur(8px)}.brand{border-radius:16px;background:rgba(255,248,223,.9);padding:9px 14px}.brand strong{display:block;font-size:clamp(13px,2vw,20px);line-height:1.05;letter-spacing:.04em}.brand small{font-size:10px;font-weight:900;color:#648097;letter-spacing:.13em}.stats{display:flex;gap:6px;padding:7px;background:rgba(255,248,223,.88);border-radius:15px}.stat{min-width:65px;text-align:center;padding:3px 7px;border-radius:10px;background:#fff}.stat b{display:block;font-size:17px;line-height:1.1}.stat span{font-size:8px;font-weight:900;letter-spacing:.1em;color:#7890a3}.coin{color:#d79500}.starstat{color:#e9a900}.life{color:#e64b46}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;white-space:nowrap;padding:9px 15px;border-radius:999px;background:rgba(255,248,223,.87);font-size:12px;font-weight:800;color:#526d83;pointer-events:none}.hint kbd{font:inherit;background:#fff;border-radius:5px;padding:3px 6px;color:#213b58;box-shadow:0 2px 0 #d9e3e9;margin:0 2px}.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:5;padding:20px;background:linear-gradient(180deg,rgba(17,67,103,.12),rgba(17,67,103,.37));transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(440px,calc(100vw - 32px));padding:27px 30px 28px;text-align:center;border-radius:27px;background:rgba(255,248,223,.96)}.emblem{font-size:45px;line-height:1}.sub{margin-top:12px;color:#68839a;font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}h1{margin:6px 0 9px;font-size:clamp(27px,6vw,39px);line-height:1.05;color:#213c58}p{margin:0 auto 20px;max-width:350px;color:#60768a;font-size:14px;line-height:1.55}.btn{border:0;border-radius:14px;padding:14px 23px;background:linear-gradient(#ff6659,#e9403c);color:white;font:inherit;font-weight:900;font-size:15px;letter-spacing:.05em;box-shadow:0 5px 0 #b93135,0 9px 18px #e9483d44;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b93135}.toast{position:absolute;z-index:3;top:24%;left:50%;transform:translate(-50%,-10px) scale(.8);padding:10px 17px;border-radius:999px;background:#fff8df;color:#da7840;font-size:14px;font-weight:950;box-shadow:0 5px 18px #214a6340;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.touch{display:none;position:absolute;z-index:3;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));align-items:flex-end;justify-content:space-between;pointer-events:none}.stick,.jump{pointer-events:auto;touch-action:none}.stick{width:116px;height:116px;border:3px solid #ffffffaa;border-radius:50%;background:#fff5d94c;position:relative;box-shadow:0 4px 14px #214a6330}.nub{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#fff8df;box-shadow:0 3px 10px #214a6350;transform:translate(-50%,-50%)}.jump{width:82px;height:82px;border:3px solid white;border-radius:50%;background:#f0564b;color:white;font-weight:950;box-shadow:0 5px 0 #bb3437;font-size:13px}.jump:active{transform:translateY(3px)}@media(max-width:700px){.topbar{left:10px;right:10px;top:max(9px,env(safe-area-inset-top));gap:5px}.brand{padding:7px 9px}.brand small{font-size:8px}.stats{gap:3px;padding:5px}.stat{min-width:47px;padding:3px 4px}.stat b{font-size:14px}.stat span{font-size:7px}.hint{display:none}.touch{display:flex}.overlay .panel{padding:23px 20px}.overlay p{font-size:13px}}
</style>
</head>
<body>
<div id="game"><canvas id="screen" aria-label="Juego de plataformas Mushroom Meadow"></canvas></div>
<div class="topbar"><div class="brand"><strong>🍄 MUSHROOM MEADOW</strong><small>AVENTURA · NIVEL 1-1</small></div><div class="stats"><div class="stat starstat"><b>⭐ <span id="stars">0/5</span></b><span>ESTRELLAS</span></div><div class="stat coin"><b>🟡 <span id="coins">00</span></b><span>MONEDAS</span></div><div class="stat"><b id="time">180</b><span>TIEMPO</span></div><div class="stat life"><b>♥ <span id="lives">3</span></b><span>VIDAS</span></div></div></div>
<div class="hint"><kbd>A</kbd><kbd>D</kbd> mover <kbd>ESPACIO</kbd> saltar <kbd>SHIFT</kbd> correr</div>
<div class="touch"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><button class="jump" id="jump">SALTAR</button></div>
<div class="toast" id="toast">¡ESTRELLA!</div>
<div class="overlay" id="overlay"><div class="panel"><div class="emblem" id="emblem">🍄</div><div class="sub" id="sub">Una aventura bajo el sol</div><h1 id="title">Pradera Champiñón</h1><p id="message">¡Recoge las 5 estrellas, esquiva a los pequeños enemigos y llega al castillo! Corre, salta y disfruta de la aventura.</p><button class="btn" id="start">¡EMPEZAR!</button></div></div>
<script>
'use strict';
(() => {
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),ui={stars:$('#stars'),coins:$('#coins'),time:$('#time'),lives:$('#lives'),overlay:$('#overlay'),title:$('#title'),message:$('#message'),sub:$('#sub'),emblem:$('#emblem'),button:$('#start'),toast:$('.toast')};
let W=innerWidth,H=innerHeight,DPR=1,scale=48,camX=0,camY=0,last=0,elapsed=0,toastLeft=0;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';scale=Math.max(22,Math.min(66,W/14.5));ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const platforms=[{a:0,b:17,y:0},{a:17,b:27,y:.55},{a:27,b:43,y:0},{a:43,b:54,y:.85},{a:54,b:72,y:.35},{a:72,b:84,y:1.05},{a:84,b:102,y:0},{a:102,b:121,y:.35},
{a:8,b:11,y:2.1},{a:21,b:24,y:2.7},{a:32,b:35,y:2.05},{a:47,b:50,y:3.05},{a:61,b:64,y:2.45},{a:77,b:80,y:3.05},{a:91,b:94,y:2.25},{a:107,b:110,y:2.6}];
const player={x:2,y:0,vx:0,vy:0,w:.72,h:1.38,ground:false,face:1};
const starXs=[8.5,26,47.5,76,105],stars=starXs.map((x,i)=>({x,y:(i===1?.2:i===3?.2:.15)+([0,.55,0,.35,.35][i])+1.65,taken:false}));
const coins=Array.from({length:26},(_,i)=>({x:4+i*4.05,y:1.65+(i%4===1?.45:0),taken:false}));
const enemies=[{x:13,lo:11,hi:16,y:0,t:0,dead:false},{x:37,lo:34,hi:41,y:0,t:1,dead:false},{x:67,lo:64,hi:70,y:.35,t:2,dead:false},{x:96,lo:91,hi:99,y:0,t:3,dead:false}];
const keys={};let joyX=0,pointer=null,playing=false,won=false,lives=3,timer=180,coinsTaken=0,starsTaken=0,checkpoint=0,invuln=0;
function reset(){player.x=2;player.y=0;player.vy=0;player.ground=true;timer=180;lives=3;coinsTaken=0;starsTaken=0;checkpoint=0;invuln=0;won=false;stars.forEach(s=>s.taken=false);coins.forEach(c=>c.taken=false);enemies.forEach(e=>e.dead=false);ui.stars.textContent='0/5';ui.coins.textContent='00';ui.lives.textContent='3';ui.time.textContent='180'}
function start(){if(won||lives<=0)reset();playing=true;ui.overlay.classList.add('hidden');last=performance.now()}
ui.button.addEventListener('click',start);
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'&&!e.repeat)jump()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
function jump(){if(playing&&player.ground){player.vy=11.2;player.ground=false}}
const stick=$('#stick'),nub=$('#nub');stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect();joyX=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width*.38)));nub.style.transform=`translate(calc(-50% + ${joyX*34}px),-50%)`}function endStick(e){if(pointer===e.pointerId){pointer=null;joyX=0;nub.style.transform='translate(-50%,-50%)'}}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function toast(text){ui.toast.textContent=text;ui.toast.classList.add('show');toastLeft=1.15}
function lose(){if(invuln>0)return;lives--;ui.lives.textContent=lives;if(lives<=0){playing=false;ui.emblem.textContent='💫';ui.sub.textContent='¡OTRO INTENTO!';ui.title.textContent='La pradera te espera';ui.message.textContent='No pasa nada: vuelve a intentarlo y guía a nuestro héroe hasta el castillo.';ui.button.textContent='REINTENTAR';ui.overlay.classList.remove('hidden');return}player.x=checkpoint;const p=platforms.find(p=>checkpoint>=p.a&&checkpoint<=p.b);player.y=p?p.y:0;player.vy=0;invuln=2;toast('¡VUELTA A LA AVENTURA!')}
function finish(){playing=false;won=true;ui.emblem.textContent='🏰';ui.sub.textContent='¡NIVEL SUPERADO!';ui.title.textContent='¡Lo lograste!';ui.message.textContent=`¡Recogiste las ${starsTaken} estrellas y llegaste al castillo! Aventura perfecta.`;ui.button.textContent='JUGAR DE NUEVO';ui.overlay.classList.remove('hidden')}
function update(dt){elapsed+=dt;if(!playing)return;timer-=dt;if(timer<=0){timer=180;lose()}ui.time.textContent=Math.ceil(timer);invuln=Math.max(0,invuln-dt);if(toastLeft>0&&(toastLeft-=dt)<=0)ui.toast.classList.remove('show');
let ix=joyX+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);ix=Math.max(-1,Math.min(1,ix));let speed=(keys.ShiftLeft||keys.ShiftRight?9:6.5);player.vx=ix*speed;player.x=Math.max(.4,Math.min(119,player.x+player.vx*dt));if(ix)player.face=Math.sign(ix);
const prev=player.y;player.vy-=25*dt;player.y+=player.vy*dt;player.ground=false;if(player.vy<=0){let landed=null;for(const p of platforms){if(player.x+player.w*.32>p.a&&player.x-player.w*.32<p.b&&prev>=p.y-.04&&player.y<=p.y){if(!landed||p.y>landed.y)landed=p}}if(landed){player.y=landed.y;player.vy=0;player.ground=true}}
if(player.y< -8)lose();if(player.x>checkpoint+15)checkpoint=Math.floor(player.x/20)*20;
for(const c of coins){if(!c.taken&&Math.hypot(player.x-c.x,player.y+0.7-c.y)<.9){c.taken=true;coinsTaken++;ui.coins.textContent=String(coinsTaken).padStart(2,'0');toast('+1 MONEDA')}}
for(const s of stars){if(!s.taken&&Math.hypot(player.x-s.x,player.y+.72-s.y)<1.15){s.taken=true;starsTaken++;ui.stars.textContent=`${starsTaken}/5`;toast(starsTaken===5?'¡TODAS LAS ESTRELLAS!':'¡ESTRELLA!')}}
for(const e of enemies){if(e.dead)continue;e.t+=dt*1.25;const ex=(e.lo+e.hi)/2+Math.sin(e.t)*(e.hi-e.lo)/2;e.cx=ex;if(Math.abs(player.x-ex)<.8&&player.y<e.y+1.25&&player.y+player.h>e.y){if(player.vy< -1&&player.y>e.y+.3){e.dead=true;player.vy=8;toast('¡BUEN SALTO!')}else lose()}}
if(player.x>116){if(starsTaken===5)finish();else{player.x=115.7;toast(`¡FALTAN ${5-starsTaken} ESTRELLAS!`)}}
}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function world(x,y){return{x:(x-camX)*scale,y:H*.77-(y-camY)*scale}}
function drawBackground(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#61c8f3');sky.addColorStop(.72,'#b8edff');sky.addColorStop(1,'#e4f8d3');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant rolling hills
for(let layer=0;layer<3;layer++){const base=H*(.66+layer*.075),amp=H*(.075-layer*.012),offset=camX*scale*(.08+layer*.07);ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10){const y=base+Math.sin((x+offset)/(125+layer*45))*amp+Math.sin((x+offset)/(52+layer*17))*amp*.23;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#a9df95','#80cf78','#66bf6e'][layer];ctx.fill()}
// floating, slowly drifting clouds
for(let i=0;i<9;i++){let x=((i*193-camX*scale*.18+elapsed*5)%(W+240)+W+240)%(W+240)-100,y=H*(.12+(i%4)*.1);ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.ellipse(x,y,34,13,0,0,Math.PI*2);ctx.ellipse(x-19,y+3,18,11,0,0,Math.PI*2);ctx.ellipse(x+17,y+2,22,13,0,0,Math.PI*2);ctx.fill()}}
function drawScenery(){for(let i=0;i<22;i++){let wx=i*6.2+1;let p=world(wx,0);if(p.x< -80||p.x>W+80)continue;const s=scale;ctx.fillStyle='#956142';ctx.fillRect(p.x-s*.13,p.y-s*1.35,s*.26,s*1.35);ctx.fillStyle=i%2?'#36a95c':'#43b761';ctx.beginPath();ctx.arc(p.x,p.y-s*1.7,s*.52,0,Math.PI*2);ctx.arc(p.x-s*.28,p.y-s*1.55,s*.34,0,Math.PI*2);ctx.arc(p.x+s*.28,p.y-s*1.58,s*.36,0,Math.PI*2);ctx.fill()}}
function drawPlatforms(){for(const p of platforms){const q=world(p.a,p.y),width=(p.b-p.a)*scale,thick=scale*.48;if(q.x>W+20||q.x+width< -20)continue;ctx.fillStyle='#89543d';ctx.fillRect(q.x,q.y,width,thick);ctx.fillStyle='#b8734c';ctx.fillRect(q.x,q.y+thick*.42,width,thick*.58);ctx.fillStyle='#53b94e';ctx.fillRect(q.x,q.y-5,width,Math.max(7,scale*.16));ctx.fillStyle='#8cdb64';ctx.fillRect(q.x,q.y-5,width,3);for(let n=0;n<Math.floor(width/(scale*.8));n++){ctx.fillStyle=n%2?'#9ae16c':'#75ce58';ctx.fillRect(q.x+n*scale*.8+5,q.y+4,scale*.18,3)}}}
function drawCoin(c){const p=world(c.x,c.y+Math.sin(elapsed*3+c.x)*.1),r=scale*.27;if(p.x< -20||p.x>W+20)return;ctx.save();ctx.translate(p.x,p.y);ctx.scale(.65+Math.abs(Math.sin(elapsed*3+c.x))*.35,1);ctx.fillStyle='#f6a900';ctx.strokeStyle='#ffdc48';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,r,r*1.18,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff0a0';ctx.beginPath();ctx.ellipse(-r*.25,-r*.25,r*.16,r*.3,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawStar(s){const p=world(s.x,s.y+Math.sin(elapsed*3+s.x)*.12),r=scale*.43;if(p.x< -30||p.x>W+30)return;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(elapsed*1.7)*.15);ctx.shadowColor='#ffde48';ctx.shadowBlur=15;ctx.fillStyle='#ffcf32';ctx.strokeStyle='#fff1a0';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#4b3b39';ctx.beginPath();ctx.arc(-r*.2,-r*.02,2.2,0,Math.PI*2);ctx.arc(r*.2,-r*.02,2.2,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawEnemy(e){if(e.dead)return;const p=world(e.cx??e.x,e.y);if(p.x< -30||p.x>W+30)return;let r=scale;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#965039';ctx.beginPath();ctx.ellipse(0,-r*.36,r*.43,r*.42,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bd7449';ctx.beginPath();ctx.ellipse(0,-r*.25,r*.49,r*.2,0,0,Math.PI*2);ctx.fill();for(const d of [-1,1]){ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(d*r*.16,-r*.48,r*.12,r*.15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#342a2d';ctx.beginPath();ctx.arc(d*r*.17,-r*.47,r*.045,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#382a2d';ctx.fillRect(-r*.35,-r*.05,r*.22,r*.1);ctx.fillRect(r*.13,-r*.05,r*.22,r*.1);ctx.restore()}
function drawHero(){const p=world(player.x,player.y),s=scale,blink=invuln>0&&Math.floor(elapsed*13)%2===0;if(blink)return;ctx.save();ctx.translate(p.x,p.y);ctx.scale(player.face,1);const bob=player.ground&&Math.abs(player.vx)>0?Math.sin(elapsed*17)*s*.035:0;ctx.translate(0,bob);ctx.fillStyle='#31584733';ctx.beginPath();ctx.ellipse(0,-2,s*.47,s*.12,0,0,Math.PI*2);ctx.fill();
// boots and overalls
ctx.fillStyle='#49343a';ctx.beginPath();ctx.ellipse(-s*.2,-s*.08,s*.22,s*.12,0,0,Math.PI*2);ctx.ellipse(s*.2,-s*.08,s*.22,s*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2866bd';roundRect(-s*.34,-s*.61,s*.68,s*.48,s*.13,'#2866bd');ctx.fillStyle='#ee5149';roundRect(-s*.37,-s*.95,s*.74,s*.45,s*.15,'#ee5149');ctx.fillStyle='#ffcb9c';ctx.beginPath();ctx.ellipse(0,-s*.91,s*.27,s*.26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#382e35';ctx.fillRect(-s*.21,-s*.77,s*.42,s*.055);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-s*.09,-s*.94,s*.06,s*.09,0,0,Math.PI*2);ctx.ellipse(s*.08,-s*.94,s*.06,s*.09,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#273a54';ctx.beginPath();ctx.arc(-s*.08,-s*.94,s*.025,0,Math.PI*2);ctx.arc(s*.09,-s*.94,s*.025,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f9d768';ctx.beginPath();ctx.arc(-s*.2,-s*.55,s*.045,0,Math.PI*2);ctx.arc(s*.2,-s*.55,s*.045,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawCastle(){const p=world(118,.3),s=scale;if(p.x< -s*4||p.x>W+s*4)return;ctx.fillStyle='#f4d18c';ctx.fillRect(p.x-s*1.65,p.y-s*3.3,s*3.3,s*3.3);ctx.fillRect(p.x-s*2.35,p.y-s*4.5,s*.9,s*4.5);ctx.fillRect(p.x+s*1.45,p.y-s*4.5,s*.9,s*4.5);ctx.fillStyle='#e94d49';for(const dx of [-1.9,1.9]){ctx.beginPath();ctx.moveTo(p.x+dx*s,p.y-s*6);ctx.lineTo(p.x+(dx-.58)*s,p.y-s*4.5);ctx.lineTo(p.x+(dx+.58)*s,p.y-s*4.5);ctx.closePath();ctx.fill()}ctx.fillStyle='#72bfe5';for(const dx of [-.9,.9]){ctx.fillRect(p.x+dx*s-s*.18,p.y-s*2.75,s*.36,s*.48);ctx.fillStyle='#fff';ctx.fillRect(p.x+dx*s-s*.025,p.y-s*2.75,s*.05,s*.48);ctx.fillRect(p.x+dx*s-s*.18,p.y-s*2.53,s*.36,s*.05);ctx.fillStyle='#72bfe5'}ctx.fillStyle='#774b3d';ctx.beginPath();ctx.roundRect(p.x-s*.3,p.y-s*1.45,s*.6,s*1.45,[s*.3,s*.3,0,0]);ctx.fill();ctx.fillStyle=starsTaken===5?'#5ad17d':'#ed5149';ctx.fillRect(p.x+s*2.55,p.y-s*4.5,s*.09,s*4.5);ctx.beginPath();ctx.moveTo(p.x+s*2.64,p.y-s*4.45);ctx.lineTo(p.x+s*3.45,p.y-s*4.05);ctx.lineTo(p.x+s*2.64,p.y-s*3.65);ctx.closePath();ctx.fill()}
function draw(){camX=Math.max(0,Math.min(121-W/scale,player.x-W/scale*.32));camY=Math.max(0,player.y-3.5);drawBackground();drawScenery();drawPlatforms();drawCastle();for(const c of coins)if(!c.taken)drawCoin(c);for(const s of stars)if(!s.taken)drawStar(s);for(const e of enemies)drawEnemy(e);drawHero()}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw()}
requestAnimationFrame(frame);
})();
